<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Retirar - SmartCube</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif}
body{background:#0a0a0c;min-height:100vh;display:flex;flex-direction:column;color:#fff;overflow-y:auto;position:relative}
body::before{content:'';position:fixed;top:-20%;left:50%;transform:translateX(-50%);width:800px;height:600px;background:radial-gradient(circle,#FF6A00 0%,transparent 70%);opacity:.15;filter:blur(60px);pointer-events:none}
.wrap{flex:1;display:flex;align-items:center;justify-content:center;padding:12px;z-index:1;min-height:100vh}
.card{width:100%;max-width:400px;background:rgba(255,255,255,.98);border-radius:28px;padding:20px 20px 16px;box-shadow:0 0 0 1px rgba(255,255,255,.1),0 20px 60px rgba(0,0,0,.6);color:#000;position:relative;max-height:96vh;overflow-y:auto}
.card::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,#FF6A00,transparent);opacity:.6}
.progress{display:flex;gap:6px;justify-content:center;margin-bottom:14px}.dot{width:24px;height:3px;border-radius:10px;background:#eee;transition:.4s}.dot.active{background:#FF6A00;width:36px}
.icon-circle{width:48px;height:48px;background:linear-gradient(135deg,#E8F5E9,#C8E6C9);border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:22px;margin:0 auto 10px}
.h1{font-size:20px;font-weight:900;text-align:center;letter-spacing:-.4px;line-height:1.1}.sub{font-size:12px;text-align:center;color:#8a8a8e;margin:6px 0 14px;font-weight:500}
.field{position:relative;margin-bottom:10px}.field span{position:absolute;left:14px;top:50%;transform:translateY(-50%);font-size:16px;opacity:.35}
.field input{width:100%;padding:14px 14px 14px 42px;border:2px solid #f1f1f3;border-radius:14px;font-size:15px;font-weight:800;background:#fafafb;outline:none;text-transform:uppercase;letter-spacing:1px}
.field input:focus{border-color:#FF6A00;background:#fff;box-shadow:0 0 0 3px rgba(255,106,0,.12)}
.btn-primary{width:100%;padding:15px;background:linear-gradient(135deg,#FF6A00,#FF8533);color:#fff;border:none;border-radius:14px;font-size:13px;font-weight:900;cursor:pointer;margin-top:8px;letter-spacing:.6px;box-shadow:0 8px 20px rgba(255,106,0,.3)}
.btn-primary:disabled{background:#e9e9ec;color:#a0a0a5;box-shadow:none}
.btn-sec{width:100%;padding:13px;background:#111;color:#FF6A00;border:none;border-radius:12px;font-size:11px;font-weight:800;cursor:pointer;margin-top:8px;letter-spacing:.4px;transition:.2s}
.btn-sec:active{transform:scale(.98)}
.step{display:none}.step.active{display:block;animation:fadeUp .3s ease}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.status-box{background:linear-gradient(135deg,#E8F5E9,#E0F2E1);border:1px solid #c8e6c9;border-radius:12px;padding:10px;text-align:center;margin:10px 0}.status-box b{color:#2e7d32;font-size:11px;line-height:1.3}
.receipt{background:#fcfcfc;border:1.5px dashed #e4e4e7;border-radius:16px;padding:10px 14px;margin:10px 0}
.receipt-title{font-size:9px;font-weight:900;letter-spacing:1.5px;color:#9a9aa0;text-align:center;margin-bottom:6px}
.row{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #f0f0f3;font-size:11.5px}.row:last-child{border:none}
.row span:first-child{color:#8a8a9a;font-weight:600}.row span:last-child{font-weight:800;color:#111}
.hint{margin-top:8px;text-align:center;font-size:10px;color:#a0a0a8;font-weight:600}
.msg-erro{background:#FEF2F2;border:1px solid #fecaca;color:#dc2626;border-radius:10px;padding:10px;text-align:center;font-size:11px;font-weight:700;margin-top:8px;display:none}
</style>
</head>
<body>
<div class="wrap">
<div class="card step active" id="s1"><div class="progress"><div class="dot active"></div><div class="dot"></div></div><div class="icon-circle">🔑</div><div class="h1">Retirar<br>encomenda</div><div class="sub">Digite o código que recebeu no App</div><div class="field"><span>🔒</span><input id="codigo" placeholder="CÓDIGO  •  Ex: 123456 ou SC-RET-..." maxlength="20"></div>
<div id="erroMsg" class="msg-erro"></div>
<button class="btn-primary" id="btnValidar" onclick="validarCodigo()">VALIDAR CÓDIGO →</button><button class="btn-sec" onclick="location.href='/tablet'">VOLTAR AO INÍCIO</button><div class="hint">🔒 Código válido por 72h</div></div>
<div class="card step" id="s2"><div class="progress"><div class="dot"></div><div class="dot active"></div></div><div class="icon-circle">✅</div><div class="h1">Retirada liberada!</div><div class="sub">Box liberado com sucesso</div><div class="status-box"><b>🔓 BOX <span id="boxNum">07</span> ABERTO - RETIRE A ENCOMENDA<br>E FECHE A PORTA</b></div>
<div class="receipt"><div class="receipt-title">COMPROVANTE DE RETIRADA</div>
<div class="row"><span>Protocolo</span><span id="protocolo">SC-000000</span></div>
<div class="row"><span>Data / Hora</span><span id="dataHora">--</span></div>
<div class="row"><span>Condomínio</span><span id="condominioNome">Residencial</span></div>
<div class="row"><span>Box</span><span style="color:#FF6A00" id="boxTxt">07</span></div>
<div class="row"><span>Código</span><span id="codigoTxt">-</span></div>
<div class="row"><span>Status</span><span style="color:#2e7d32">● RETIRADO</span></div>
</div>
<button class="btn-primary" onclick="location.href='/tablet'">CONCLUIR ✓</button></div>
</div>
<script>
// ETAPA 1.4 + ETAPA 2 - Sem localStorage de condomínio, rota certa do tablet
function getTabletToken(){ return localStorage.getItem('tablet_token') || ''; }
let tabletInfo = null;

async function carregarCondominio(){
 try{
   let token = getTabletToken();
   if(!token){ location.href='/tablet'; return; }
   let r = await fetch('/api/tablet/info', { headers: { 'X-Tablet-Token': token } });
   if(!r.ok) throw new Error('token invalido');
   tabletInfo = await r.json();
   document.getElementById('condominioNome').innerText = tabletInfo.condominio_nome || 'Residencial';
 }catch(e){ location.href='/tablet'; }
}
carregarCondominio();

let processando = false;
async function validarCodigo(){
  if(processando) return;
  let el = document.getElementById('codigo');
  let cod = el.value.trim().toUpperCase();
  let btn = document.getElementById('btnValidar');
  let erro = document.getElementById('erroMsg');
  erro.style.display='none';
  if(!cod || cod.length < 3){ erro.innerText='Digite o código'; erro.style.display='block'; return; }
  if(cod.startsWith('SC-') && !cod.startsWith('SC-RET-')){
    erro.innerText='❌ Protocolo de entregador não abre box. Use o código do morador (6 dígitos ou SC-RET-...)';
    erro.style.display='block';
    return;
  }
  processando = true;
  btn.disabled = true;
  btn.innerText = 'VALIDANDO...';
  try{
    // ROTA CERTA: /api/tablet/retirada com X-Tablet-Token. Idempotente no backend - mesmo código 2x não abre 2x.
    let resp = await fetch('/api/tablet/retirada', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-Tablet-Token': getTabletToken() },
      body: JSON.stringify({ codigo: cod })
    });
    if(!resp.ok){
      let msg = 'Código inválido ou já retirado';
      try{ let j = await resp.json(); if(j.detail) msg = j.detail; }catch{}
      erro.innerText = '❌ ' + msg;
      erro.style.display='block';
      btn.disabled = false;
      btn.innerText = 'VALIDAR CÓDIGO →';
      processando = false;
      return;
    }
    let d = await resp.json();
    let boxReal = d.box || '07';
    document.getElementById('codigoTxt').innerText = cod;
    document.getElementById('protocolo').innerText = cod;
    document.getElementById('boxNum').innerText = boxReal;
    document.getElementById('boxTxt').innerText = boxReal;
    let n = new Date();
    document.getElementById('dataHora').innerText = n.toLocaleDateString('pt-BR')+' '+n.toLocaleTimeString('pt-BR').slice(0,5);
    document.getElementById('s1').classList.remove('active');
    document.getElementById('s2').classList.add('active');
    setTimeout(()=>location.href='/tablet',10000);
  }catch(err){
    erro.innerText = 'Erro de conexão com servidor';
    erro.style.display='block';
    btn.disabled = false;
    btn.innerText = 'VALIDAR CÓDIGO →';
    processando = false;
  }
}
</script>
</body>
</html>
