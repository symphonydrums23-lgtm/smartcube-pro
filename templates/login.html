<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Login - Smart Cube</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Inter,sans-serif}
body{display:flex;min-height:100vh}
.left{width:42%;background:#151821;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;padding:40px}
.left img{width:180px;margin-bottom:20px}
.right{flex:1;background:#fff;display:flex;align-items:center;justify-content:center;padding:40px}
.box{width:100%;max-width:380px}
.input{width:100%;padding:14px;border:1px solid #e5e7eb;border-radius:10px;margin-top:10px;font-size:14px;background:#f9fafb}
.btn{width:100%;padding:14px;background:#FF6A00;color:#fff;border:0;border-radius:10px;margin-top:18px;font-weight:800;cursor:pointer;font-size:14px}
.btn:disabled{opacity:.6;cursor:not-allowed}
.err{background:#FEF2F2;border:1px solid #FECACA;color:#991B1B;padding:10px;border-radius:8px;font-size:12px;margin-top:12px;display:none}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
@media(max-width:768px){.left{display:none}.right{padding:20px}}
</style>
</head>
<body>
<div class="left">
  <img src="logo.dashboard.png" onerror="this.src='logo.png'" alt="Logo Smart Cube">
  <div style="margin-top:16px;font-size:13px;color:#9ca3af;text-align:center;line-height:1.6">Sistema inteligente de armários para<br>condomínios.<br>Faça login para acessar o painel.</div>
</div>
<main class="right">
  <div class="box">
    <b style="font-size:22px">Bem-vindo de volta</b>
    <div style="font-size:12px;color:#6b7280;margin-top:4px">Entre com suas credenciais</div>
    <label class="sr-only" for="user">Usuário</label>
    <input id="user" class="input" placeholder="Usuário" autocomplete="username" required aria-required="true">
    <label class="sr-only" for="pass">Senha</label>
    <input id="pass" class="input" placeholder="Senha" type="password" autocomplete="current-password" required aria-required="true">
    <button type="button" id="btnLogin" class="btn">ENTRAR NO PAINEL →</button>
    <div id="err" class="err" role="alert" aria-live="polite"></div>
    <div style="font-size:10px;color:#888;margin-top:12px;text-align:center">© 2026 Smart Cube • v6.1 Seguro</div>
  </div>
</main>
<script>
const API_BASE = window.location.origin;

function showErr(msg){
  const el = document.getElementById('err');
  el.style.display='block';
  // CORRIGIDO: textContent, não innerText - padrão dos outros arquivos
  el.textContent = msg;
}

async function safeJson(r){
  const ct = r.headers.get('content-type') || '';
  if(!ct.includes('application/json')) return null;
  try{ return await r.json(); }catch(e){ console.error('[SmartCube] JSON invalido', { status: r.status, url: r.url }); return null; }
}

async function doLogin(){
  const btn = document.getElementById('btnLogin');
  if(btn.disabled) return;
  // CORRIGIDO: não dá trim() na senha - antes senha " 1234 " virava "1234" e login falhava / senha com espaço no fim nunca entrava
  const u = document.getElementById('user').value.trim();
  const p = document.getElementById('pass').value;

  if(!u || !p){ showErr('Digite usuário e senha'); return; }

  btn.disabled = true;
  btn.textContent = 'ENTRANDO...';
  document.getElementById('err').style.display='none';

  const controller = new AbortController();
  const timer = setTimeout(()=>controller.abort(), 10000);
  try{
    const r = await fetch(API_BASE+'/api/auth/login',{
      method:'POST',
      signal: controller.signal,
      headers:{'Content-Type':'application/json'},
      credentials: 'include',
      body: JSON.stringify({usuario: u, senha: p})
    });
    clearTimeout(timer);
    const j = await safeJson(r);

    if(!r.ok){
      // CORRIGIDO: mensagem genérica, não vaza se usuário existe ou não
      // Antes backend devolvia "usuário não encontrado" vs "senha errada" e dava pra enumerar usuários
      showErr('Usuário ou senha inválido');
      btn.disabled = false;
      btn.textContent = 'ENTRAR NO PAINEL →';
      return;
    }

    if(j && j.ok){
      // CORRIGIDO: limpa senha do campo e do DOM antes de ir pro dashboard
      document.getElementById('pass').value='';
      try { localStorage.removeItem('sc_token'); } catch(e){ console.error('[SmartCube] limpar sc_token', e); }
      try { localStorage.removeItem('sc_user'); } catch(e){ console.error('[SmartCube] limpar sc_user', e); }
      try { sessionStorage.removeItem('sc_token'); } catch(e){}
      window.location.replace('/dashboard');
    }else{
      showErr('Erro no login');
      btn.disabled = false;
      btn.textContent = 'ENTRAR NO PAINEL →';
    }
  }catch(e){
    clearTimeout(timer);
    if(e && e.name === 'AbortError'){
      console.error('[SmartCube] doLogin timeout', e);
      showErr('Tempo esgotado. Tente de novo.');
    } else {
      console.error('[SmartCube] doLogin', e);
      // CORRIGIDO: não mostra e.message pro usuário - antes mostrava "Failed to fetch" e detalhes de rede
      showErr('Erro de conexão com servidor. Tente de novo.');
    }
    btn.disabled = false;
    btn.textContent = 'ENTRAR NO PAINEL →';
  }
}

document.getElementById('btnLogin').addEventListener('click', doLogin);
document.getElementById('user').addEventListener('keydown', e=>{
  if(e.key==='Enter') doLogin();
});
document.getElementById('pass').addEventListener('keydown', e=>{
  if(e.key==='Enter') doLogin();
});

(async ()=>{
  try{
    const r = await fetch(API_BASE+'/api/auth/verificar',{ credentials: 'include' });
    if(r.ok){
      window.location.replace('/dashboard');
    }
  }catch(e){ console.error('[SmartCube] auto-login verificar', e); }
})();
</script>
</body>
</html>
