<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Smart Cube - Menu</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif}
body{background:#0a0a0a;height:100vh;width:100vw;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;overflow:hidden}
.logo-img{width:210px;height:auto;filter:drop-shadow(0 4px 20px rgba(255,106,0,.2));user-select:none;-webkit-user-select:none;touch-action:none}
.btn{width:92%;max-width:380px;height:120px;border-radius:20px;border:none;font-size:22px;font-weight:900;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;transition:.2s}
.btn:active{transform:scale(.97)}
.btn small{font-size:11px;opacity:.7;font-weight:700;letter-spacing:.5px}
.btn-entregar{background:#fff;color:#000;box-shadow:0 10px 30px rgba(255,255,255,.1)}
.btn-receber{background:transparent;color:#FF6A00;border:2.5px solid #FF6A00;box-shadow:0 10px 30px rgba(255,106,0,.15)}
.voltar{margin-top:12px;color:#444;font-size:11px;font-weight:700;letter-spacing:1px;cursor:pointer;padding:10px 20px;border-radius:12px}
.voltar:active{background:#111;color:#FF6A00}
.arm-label{color:#FF6A00;font-size:10px;font-weight:800;letter-spacing:1.2px;margin-top:-8px;opacity:.8}
#setupOverlay{position:fixed;inset:0;background:rgba(0,0,0,.95);display:none;align-items:center;justify-content:center;z-index:9999;padding:20px}
#setupBox{width:100%;max-width:360px;background:#111;border:1px solid #222;border-radius:20px;padding:20px}
#setupBox h2{color:#fff;font-size:16px;font-weight:900;text-align:center;margin-bottom:12px}
#setupBox select,#setupBox button{width:100%;padding:14px;border-radius:12px;border:none;font-weight:800;font-size:14px;margin-top:10px}
#setupBox select{background:#fff;color:#000}
#setupBox button{background:#FF6A00;color:#fff;cursor:pointer}
#setupBox small{color:#666;font-size:10px;display:block;text-align:center;margin-top:10px}
</style>
</head>
<body>
<img src="/logo.png" class="logo-img" alt="Smart Cube" id="logo">
<div class="arm-label" id="armLabel"></div>
<button class="btn btn-entregar" onclick="location.href='/entrega'">📦 ENTREGAR<small>ENTREGADOR / PORTARIA</small></button>
<button class="btn btn-receber" onclick="location.href='/retirada'">🔑 RECEBER<small>MORADOR</small></button>
<button class="btn btn-deposito" onclick="location.href='/deposito-interno'">📦 DEVOLVER<small>ENCOMENDA ERRADA / POR DENTRO</small></button>
<div class="voltar" id="btnVoltar" onclick="location.href='/'">VOLTAR AO INÍCIO</div>

<!-- SETUP OCULTO -->
<div id="setupOverlay">
  <div id="setupBox">
    <h2>🔒 INSTALAÇÃO DO ARMÁRIO</h2>
    <select id="selConds"><option>Carregando condomínios...</option></select>
    <button onclick="travarArmario()">TRAVAR NESTE CONDOMÍNIO</button>
    <button style="background:#222;color:#888;margin-top:8px" onclick="fecharSetup()">CANCELAR</button>
    <small>Esta ação só precisa ser feita 1 vez.<br>Depois o tablet fica travado no ARM.</small>
  </div>
</div>

<script>
// ETAPA 1.4 - localStorage guarda SÓ o token do tablet, nunca o condomínio
// Condomínio vem do backend pelo token. Limpar localStorage não destrava, só desloga o tablet.
function getTabletToken(){ return localStorage.getItem('tablet_token') || ''; }

async function carregarInfoTablet(){
  const token = getTabletToken();
  const label = document.getElementById('armLabel');
  const btnVoltar = document.getElementById('btnVoltar');
  if(!token){
    label.innerText = 'TABLET NÃO CONFIGURADO - SEGURE A LOGO 4s';
    btnVoltar.style.display = 'block';
    return;
  }
  try{
    let r = await fetch('/api/tablet/info', { headers: { 'X-Tablet-Token': token } });
    if(!r.ok) throw new Error('token invalido');
    let d = await r.json();
    // d = { condominio_id, condominio_nome, codigo_armario }
    label.innerText = (d.codigo_armario || 'ARM') + ' • ' + (d.condominio_nome || '');
    btnVoltar.style.display = 'none';
    // Guarda só pra exibição da saudação "Seja bem-vindo ao [Nome]" - não é usado pra decidir condomínio
    sessionStorage.setItem('condominio_nome_exibir', d.condominio_nome || '');
  }catch(e){
    label.innerText = 'TABLET NÃO CONFIGURADO - SEGURE A LOGO 4s';
    btnVoltar.style.display = 'block';
  }
}
carregarInfoTablet();

// SETUP - SEGURA LOGO 4s
let pressTimer;
const logo = document.getElementById('logo');
logo.addEventListener('touchstart', ()=>{ pressTimer = setTimeout(abrirSetup, 4000); });
logo.addEventListener('touchend', ()=>{ clearTimeout(pressTimer); });
logo.addEventListener('mousedown', ()=>{ pressTimer = setTimeout(abrirSetup, 4000); });
logo.addEventListener('mouseup', ()=>{ clearTimeout(pressTimer); });

async function abrirSetup(){
  document.getElementById('setupOverlay').style.display='flex';
  try{
    let r = await fetch('/api/condominios');
    if(r.ok){
      let conds = await r.json();
      let sel = document.getElementById('selConds');
      sel.innerHTML = '';
      conds.forEach(c=>{
        if(c.id === '1') return;
        let opt = document.createElement('option');
        opt.value = c.id;
        opt.textContent = (c.codigo_armario||'ARM')+' - '+c.nome;
        sel.appendChild(opt);
      });
    }
  }catch(e){}
}
function fecharSetup(){ document.getElementById('setupOverlay').style.display='none'; }

async function travarArmario(){
  let sel = document.getElementById('selConds');
  let condId = sel.value;
  if(!condId) return;
  // Pede token do tablet pro backend. O backend que trava condomínio <-> token.
  // Essa rota exige login de admin (cookie sc_token). Se não estiver logado, volta pro /login.
  try{
    let r = await fetch('/api/tablet/registrar', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ condominio_id: condId, tablet_id: 'tablet-' + condId })
    });
    if(r.status === 401){ alert('Faça login de admin antes de travar o tablet.'); location.href = '/login'; return; }
    if(!r.ok) throw new Error('falha registrar');
    let d = await r.json();
    // Só o token fica salvo. Nada de condominio_selecionado / nome / arm / travado
    localStorage.setItem('tablet_token', d.tablet_token);
    alert('Travado! Tablet reiniciando travado.');
    location.reload();
  }catch(e){
    alert('Erro ao travar tablet. Tente de novo.');
  }
}

// IA PACK - SILENCIOSA - usa só o token, não o condominio do localStorage
async function iaTabletBackground(){
  try{
    let token = getTabletToken();
    if(!token) return;
    let r = await fetch('/api/tablet/info', { headers: { 'X-Tablet-Token': token } });
    if(!r.ok) return;
    let d = await r.json();
    let r2 = await fetch('/api/ia/lotacao-24h?condominio='+encodeURIComponent(d.condominio_id));
    if(!r2.ok) return;
    let ia = await r2.json();
    console.log('[IA Tablet] Cond:', d.condominio_id, 'Previsao:', ia.previsao_percent+'%');
  }catch(e){}
}
iaTabletBackground();
setInterval(iaTabletBackground, 300000);
</script>
</body>
</html>
