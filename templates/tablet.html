<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Smart Cube - Menu</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif}
body{background:#0a0a0a;height:100vh;width:100vw;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;overflow:hidden}
.logo-img{width:210px;height:auto;filter:drop-shadow(0 4px 20px rgba(255,106,0,.2));user-select:none;-webkit-user-select:none;touch-action:none}
.btn{width:92%;max-width:380px;height:120px;border-radius:20px;border:none;font-size:22px;font-weight:900;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;transition:.2s}
.btn:active{transform:scale(.97)}
.btn small{font-size:11px;opacity:.7;font-weight:700;letter-spacing:.5px}
.btn-entregar{background:#fff;color:#000;box-shadow:0 10px 30px rgba(255,255,255,.1)}
.btn-deposito{background:#f59e0b;color:#fff;box-shadow:0 10px 30px rgba(245,158,11,.25)}
.voltar{margin-top:12px;color:#444;font-size:11px;font-weight:700;letter-spacing:1px;cursor:pointer;padding:10px 20px;border-radius:12px;background:transparent;border:none;font-family:'Inter',sans-serif}
.voltar:active{background:#111;color:#FF6A00}
.arm-label{color:#FF6A00;font-size:10px;font-weight:800;letter-spacing:1.2px;margin-top:-8px;opacity:.8}
#setupOverlay{position:fixed;inset:0;background:rgba(0,0,0,.95);display:none;align-items:center;justify-content:center;z-index:9999;padding:20px}
#setupBox{width:100%;max-width:360px;background:#111;border:1px solid #222;border-radius:20px;padding:20px}
#setupBox h2{color:#fff;font-size:16px;font-weight:900;text-align:center;margin-bottom:12px}
#setupBox select,#setupBox button{width:100%;padding:14px;border-radius:12px;border:none;font-weight:800;font-size:14px;margin-top:10px}
#setupBox select{background:#fff;color:#000}
#setupBox button{background:#FF6A00;color:#fff;cursor:pointer}
#setupBox small{color:#666;font-size:10px;display:block;text-align:center;margin-top:10px}
</style>
</head>
<body>
<img src="/logo.png" class="logo-img" alt="Smart Cube" id="logo">
<div class="arm-label" id="armLabel"></div>
<button type="button" id="btnEntregar" class="btn btn-entregar">📦 ENTREGAR<small>ENTREGADOR / PORTARIA</small></button>
<button type="button" id="btnReceber" class="btn btn-receber">🔑 RECEBER<small>MORADOR</small></button>
<button type="button" id="btnDeposito" class="btn btn-deposito" style="display:none">📦 DEVOLVER<small>ENCOMENDA ERRADA / POR DENTRO</small></button>
<button type="button" class="voltar" id="btnVoltar">VOLTAR AO INÍCIO</button>

<!-- SETUP OCULTO -->
<div id="setupOverlay">
  <div id="setupBox">
    <h2>🔒 INSTALAÇÃO DO ARMÁRIO</h2>
    <select id="selConds"><option>Carregando condomínios...</option></select>
    <button type="button" id="btnTravar">TRAVAR NESTE CONDOMÍNIO</button>
    <button type="button" id="btnCancelarSetup" style="background:#222;color:#888;margin-top:8px">CANCELAR</button>
    <small>Esta ação só precisa ser feita 1 vez.<br>Depois o tablet fica travado no ARM.</small>
  </div>
</div>

<script>
// ETAPA 1.4 - localStorage guarda SÓ o token do tablet, nunca o condomínio
function getTabletToken(){ return localStorage.getItem('tablet_token') || ''; }

// MARQUINHOS - valida content-type antes de .json() - se voltar HTML, não quebra
async function safeJson(r){
  const ct = r.headers.get('content-type') || '';
  if(!ct.includes('application/json')) return null;
  try{ return await r.json(); }catch(e){ console.error('[SmartCube] JSON invalido', { status: r.status, url: r.url }); return null; }
}

async function carregarInfoTablet(){
  const token = getTabletToken();
  const label = document.getElementById('armLabel');
  const btnVoltar = document.getElementById('btnVoltar');
  if(!token){
    label.innerText = 'TABLET NÃO CONFIGURADO - SEGURE A LOGO 4s';
    btnVoltar.style.display = 'block';
    return;
  }
  try{
    let r = await fetch('/api/tablet/info', { headers: { 'X-Tablet-Token': token } });
    if(!r.ok) throw new Error('token invalido');
    let d = await safeJson(r);
    if(!d) throw new Error('resposta invalida');
    label.innerText = (d.codigo_armario || 'ARM') + ' • ' + (d.condominio_nome || '');
    btnVoltar.style.display = 'none';
    let btnDep = document.getElementById('btnDeposito');
    if(d.dupla_face || d.is_dupla_face || d.duplaFace){ btnDep.style.display = 'flex'; } else { btnDep.style.display = 'none'; }
    sessionStorage.setItem('condominio_nome_exibir', d.condominio_nome || '');
  }catch(e){
    console.error('[SmartCube] carregarInfoTablet', e);
    label.innerText = 'TABLET NÃO CONFIGURADO - SEGURE A LOGO 4s';
    btnVoltar.style.display = 'block';
  }
}
carregarInfoTablet();

// NAVEGACAO - addEventListener (Marquinhos) - mesmas rotas de antes
document.getElementById('btnEntregar').addEventListener('click', ()=>{ location.href='/entrega'; });
document.getElementById('btnReceber').addEventListener('click', ()=>{ location.href='/retirada'; });
document.getElementById('btnDeposito').addEventListener('click', ()=>{ location.href='/deposito-interno'; });
document.getElementById('btnVoltar').addEventListener('click', ()=>{ location.href='/'; });
document.getElementById('btnTravar').addEventListener('click', travarArmario);
document.getElementById('btnCancelarSetup').addEventListener('click', fecharSetup);

// SETUP - SEGURA LOGO 4s
let pressTimer;
const logo = document.getElementById('logo');
logo.addEventListener('touchstart', ()=>{ pressTimer = setTimeout(abrirSetup, 4000); });
logo.addEventListener('touchend', ()=>{ clearTimeout(pressTimer); });
logo.addEventListener('mousedown', ()=>{ pressTimer = setTimeout(abrirSetup, 4000); });
logo.addEventListener('mouseup', ()=>{ clearTimeout(pressTimer); });

async function abrirSetup(){
  document.getElementById('setupOverlay').style.display='flex';
  try{
    let r = await fetch('/api/condominios');
    if(r.ok){
      let conds = await safeJson(r);
      if(!conds) return;
      let sel = document.getElementById('selConds');
      sel.innerHTML = '';
      conds.forEach(c=>{
        if(c.id === '1') return;
        let opt = document.createElement('option');
        opt.value = c.id;
        opt.textContent = (c.codigo_armario||'ARM')+' - '+c.nome;
        sel.appendChild(opt);
      });
    }
  }catch(e){ console.error('[SmartCube] abrirSetup', e); }
}
function fecharSetup(){ document.getElementById('setupOverlay').style.display='none'; }

async function travarArmario(){
  let sel = document.getElementById('selConds');
  let condId = sel.value;
  if(!condId) return;
  try{
    let r = await fetch('/api/tablet/registrar', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ condominio_id: condId, tablet_id: 'tablet-' + condId })
    });
    if(r.status === 401){ alert('Faça login de admin antes de travar o tablet.'); location.href = '/login'; return; }
    if(!r.ok) throw new Error('falha registrar');
    let d = await safeJson(r);
    if(!d || !d.tablet_token) throw new Error('sem token');
    localStorage.setItem('tablet_token', d.tablet_token);
    alert('Travado! Tablet reiniciando travado.');
    location.reload();
  }catch(e){
    console.error('[SmartCube] travarArmario', e);
    alert('Erro ao travar tablet. Tente de novo.');
  }
}

// IA PACK - SILENCIOSA
async function iaTabletBackground(){
  try{
    let token = getTabletToken();
    if(!token) return;
    let r = await fetch('/api/tablet/info', { headers: { 'X-Tablet-Token': token } });
    if(!r.ok) return;
    let d = await safeJson(r);
    if(!d) return;
    let r2 = await fetch('/api/ia/lotacao-24h?condominio='+encodeURIComponent(d.condominio_id));
    if(!r2.ok) return;
    let ia = await safeJson(r2);
    if(!ia) return;
    console.log('[IA Tablet] Cond:', d.condominio_id, 'Previsao:', ia.previsao_percent+'%');
  }catch(e){ console.error('[SmartCube] iaTabletBackground', e); }
}
iaTabletBackground();
const iaIntervalId = setInterval(iaTabletBackground, 300000);

// ===== PARTE 2 - 1/2/3/4 - ABRIR PORTA + OFFLINE + LOG =====
function gerarNonce(){
  return Date.now().toString(36) + '-' + Math.random().toString(36).slice(2,10);
}
const FILA_KEY = 'fila_offline_smartcube';
function getFilaOffline(){ try{ return JSON.parse(localStorage.getItem(FILA_KEY) || '[]'); }catch(e){ console.error('[SmartCube] getFilaOffline', e); return []; } }
function setFilaOffline(fila){ localStorage.setItem(FILA_KEY, JSON.stringify(fila)); }
function enfileirarOffline(dados){
  const fila = getFilaOffline();
  fila.push({ ...dados, _offline_em: new Date().toISOString() });
  setFilaOffline(fila);
  alert('Sem internet! Comando salvo, vai sincronizar quando voltar.');
}
async function sincronizarFilaOffline(){
  const fila = getFilaOffline();
  if(!fila.length) return;
  if(!navigator.onLine) return;
  const restantes = [];
  for(const item of fila){
    try{
      const r = await fetch('/api/tablet/abrir-porta', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'X-Tablet-Token': getTabletToken() },
        body: JSON.stringify({ box: item.box, lado: item.lado, acao: item.acao, nonce: gerarNonce() })
      });
      if(!r.ok) restantes.push(item);
    }catch(e){ console.error('[SmartCube] sincronizarFilaOffline', e); restantes.push(item); }
  }
  setFilaOffline(restantes);
}
window.addEventListener('online', sincronizarFilaOffline);
const filaIntervalId = setInterval(sincronizarFilaOffline, 10000);
sincronizarFilaOffline();

async function abrirPorta(box, lado, acao){
  const token = getTabletToken();
  if(!token){ alert('Tablet não configurado'); return; }
  const nonce = gerarNonce();
  const payload = { box: String(box), lado: lado, acao: acao, nonce: nonce };
  try{
    const r = await fetch('/api/tablet/abrir-porta', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-Tablet-Token': token },
      body: JSON.stringify(payload)
    });
    if(!r.ok){
      const err = await safeJson(r) || {};
      if(r.status === 409){ alert('Comando já usado, tente de novo'); return; }
      throw new Error(err.detail || 'Erro ao abrir');
    }
    const d = await safeJson(r);
    console.log('Porta aberta:', d);
    fetch('/api/tablet/porta-evento', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-Tablet-Token': token },
      body: JSON.stringify({ box: box, lado: lado, evento: 'ABERTA', motivo: 'COMANDO' })
    }).catch((e)=>{ console.error('[SmartCube] porta-evento ABERTA', e); });
    setTimeout(()=>{
      fetch('/api/tablet/porta-evento', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'X-Tablet-Token': token },
        body: JSON.stringify({ box: box, lado: lado, evento: 'FECHADA', motivo: 'TIMEOUT' })
      }).catch((e)=>{ console.error('[SmartCube] porta-evento FECHADA', e); });
    }, 15000);
    alert('Porta ' + box + ' lado ' + lado + ' ABERTA por 15s');
  }catch(e){
    console.error('[SmartCube] abrirPorta', e);
    enfileirarOffline(payload);
  }
}

// MARQUINHOS - limpa intervals no unload - Kiosk 24h sem vazar memoria
window.addEventListener('beforeunload', ()=>{
  clearInterval(iaIntervalId);
  clearInterval(filaIntervalId);
});
</script>
</body>
</html>
