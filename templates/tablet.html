<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Smart Cube - Menu</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif}
body{background:#0a0a0a;height:100vh;width:100vw;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;overflow:hidden}
.logo-img{width:210px;height:auto;filter:drop-shadow(0 4px 20px rgba(255,106,0,.2))}
.btn{width:92%;max-width:380px;height:120px;border-radius:20px;border:none;font-size:22px;font-weight:900;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;transition:.2s}
.btn:active{transform:scale(.97)}
.btn small{font-size:11px;opacity:.7;font-weight:700;letter-spacing:.5px}
.btn-entregar{background:#fff;color:#000;box-shadow:0 10px 30px rgba(255,255,255,.1)}
.btn-receber{background:transparent;color:#FF6A00;border:2.5px solid #FF6A00;box-shadow:0 10px 30px rgba(255,106,0,.15)}
.voltar{margin-top:12px;color:#444;font-size:11px;font-weight:700;letter-spacing:1px;cursor:pointer;padding:10px 20px;border-radius:12px}
.voltar:active{background:#111;color:#FF6A00}
</style>
</head>
<body>
<img src="/logo.png" class="logo-img" alt="Smart Cube">
<button class="btn btn-entregar" onclick="location.href='/entrega'">📦 ENTREGAR<small>ENTREGADOR / PORTARIA</small></button>
<button class="btn btn-receber" onclick="location.href='/retirada'">🔑 RECEBER<small>MORADOR</small></button>
<div class="voltar" onclick="location.href='/'">VOLTAR AO INÍCIO</div>

<!-- IA PACK v5.5.1 - TABLET - SILENCIOSA - NAO ALTERA VISUAL -->
<script>
// IA roda escondida no tablet - sem botao, sem painel - so backend nuvem
async function iaTabletBackground(){
  try{
    // IA Previsao + Regra 24h + Seguranca rodando silencioso
    let r = await fetch('/api/ia/lotacao-24h?condominio=1');
    if(!r.ok) return;
    let d = await r.json();
    // Log silencioso para dashboard - nao mostra pro morador/entregador
    console.log('[IA Tablet Silenciosa] Previsao:', d.previsao_percent+'% | Atrasadas:', d.total_atrasados);
    // Se tiver >24h, avisa so no console/dashboard, nao no tablet
    if(d.total_atrasados > 0){
      // Guarda em localStorage pro dashboard ler depois se precisar
      localStorage.setItem('sc_ia_tablet_alerta', JSON.stringify({hora: new Date().toISOString(), atrasadas: d.total_atrasados, previsao: d.previsao_percent}));
    }
    // IA Gestora + Seguranca tambem rodam no backend main.py - tablet so consome cache
  }catch(e){
    console.log('[IA Tablet] Aguardando main.py v5.5');
  }
}
// Roda ao abrir e a cada 5min - nuvem ready - 100 armarios
iaTabletBackground();
setInterval(iaTabletBackground, 300000);
</script>
<!-- IA PACK FIM -->
</body>
</html>
